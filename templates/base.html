<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Furgoni</title>

    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Furgoni">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #0f172a;
            font-size: 16px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 14px;
            color: #111827;
        }

        h3 {
            font-size: 18px;
            margin-top: 22px;
            margin-bottom: 12px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
        }

        .topbar {
            background: #0f172a;
            color: white;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            color: white;
        }

        .topbar a {
            background: white;
            color: #0f172a;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .muted {
            color: #64748b;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 16px;
            margin-bottom: 10px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .pickup-btn {
            background: #16a34a;
        }

        .pickup-btn:hover {
            background: #15803d;
        }

        .return-btn {
            background: #ea580c;
        }

        .return-btn:hover {
            background: #c2410c;
        }

        .checkboxes label {
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            gap: 15px;
        }

        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .stats {
            font-size: 34px;
            font-weight: bold;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        img {
            max-width: 100%;
        }

        .flash {
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 14px;
            font-weight: bold;
        }

        .flash.success {
            background: #dcfce7;
            color: #166534;
        }

        .flash.error {
            background: #fee2e2;
            color: #991b1b;
        }

        a {
            color: #2563eb;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .card {
                padding: 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }

            h2 {
                font-size: 21px;
            }

            button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

{% block content %}
{% endblock %}

</body>
</html>
